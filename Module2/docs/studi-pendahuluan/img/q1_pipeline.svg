<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550">
<rect width="760" height="550" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="380" y="24" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">Rendering pipeline tujuh tahap</text>
<rect x="40" y="40" width="680" height="50" fill="#e3e8f2" stroke="#555" stroke-width="1"/>
<text x="55" y="61" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222">1. Application</text>
<text x="55" y="79" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#333">scene: posisi vertex, warna, transformasi</text>
<text x="705" y="61" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#555">CPU, kode saya</text>
<line x1="380" y1="90" x2="380" y2="108" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="108" width="680" height="50" fill="#fde7cf" stroke="#555" stroke-width="1"/>
<text x="55" y="129" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222">2. Vertex processing</text>
<text x="55" y="147" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#333">vertex dunia -&gt; vertex layar (pixel)</text>
<text x="705" y="129" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#555">programmable (vertex shader)</text>
<line x1="380" y1="158" x2="380" y2="176" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="176" width="680" height="50" fill="#e3e8f2" stroke="#555" stroke-width="1"/>
<text x="55" y="197" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222">3. Primitive assembly &amp; clipping</text>
<text x="55" y="215" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#333">vertex -&gt; garis / segitiga, dipotong ke layar</text>
<text x="705" y="197" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#555">fixed</text>
<line x1="380" y1="226" x2="380" y2="244" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="244" width="680" height="50" fill="#d7ecd9" stroke="#555" stroke-width="2.5"/>
<text x="55" y="265" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222">4. Rasterisation</text>
<text x="55" y="283" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#333">primitif -&gt; fragment (kandidat pixel)</text>
<text x="705" y="265" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#555">fixed (raster.mjs di modul ini)</text>
<line x1="380" y1="294" x2="380" y2="312" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="312" width="680" height="50" fill="#fde7cf" stroke="#555" stroke-width="1"/>
<text x="55" y="333" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222">5. Fragment shading</text>
<text x="55" y="351" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#333">fragment -&gt; warna per fragment</text>
<text x="705" y="333" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#555">programmable (fragment shader)</text>
<line x1="380" y1="362" x2="380" y2="380" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="380" width="680" height="50" fill="#e3e8f2" stroke="#555" stroke-width="1"/>
<text x="55" y="401" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222">6. Per-fragment operations</text>
<text x="55" y="419" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#333">warna + depth/alpha/stencil -&gt; lolos atau dibuang</text>
<text x="705" y="401" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#555">fixed, bisa dikonfigurasi</text>
<line x1="380" y1="430" x2="380" y2="448" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="448" width="680" height="50" fill="#e3e8f2" stroke="#555" stroke-width="1"/>
<text x="55" y="469" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" font-weight="bold" fill="#222">7. Framebuffer</text>
<text x="55" y="487" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#333">grid pixel jadi -&gt; layar atau file</text>
<text x="705" y="469" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="end" font-weight="normal" fill="#555">fixed</text>
<rect x="40" y="520" width="14" height="14" fill="#fde7cf" stroke="#555" stroke-width="1"/>
<text x="60" y="532" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222">programmable (shader)</text>
<rect x="230" y="520" width="14" height="14" fill="#e3e8f2" stroke="#555" stroke-width="1"/>
<text x="250" y="532" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222">fixed-function</text>
<rect x="380" y="520" width="14" height="14" fill="#d7ecd9" stroke="#555" stroke-width="2.5"/>
<text x="400" y="532" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#222">tahap yang saya bangun di Modul 2</text>
</svg>
